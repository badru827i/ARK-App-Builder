plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ark.generated'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ark.generated.arkapp'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

